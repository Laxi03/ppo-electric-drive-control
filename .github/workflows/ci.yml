name: Python CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Build distribution
        run: |
          python -m pip install build
          python -m build
      - name: Install CPU PyTorch and the built wheel
        run: |
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install dist/*.whl
          python -m pip check
      - name: Check CLI and run tests
        run: |
          rllib-control --help
          python -m rllib_control results --help
          python -m unittest discover -s tests -v
      - name: Train and reload a fresh checkpoint
        run: |
          rllib-control train --motor dc --controller ppo --run ci_smoke --iterations 1 --num-env-runners 0 --train-batch-size 512 --minibatch-size 128 --num-epochs 1
          rllib-control results --motor dc --controller ppo --ppo-run ci_smoke
